name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (workspace recursive)
        run: pnpm -r install --frozen-lockfile

      - name: Run unit tests for router package
        run: pnpm -F @wot-ui/router exec vitest run

      # test:types builds the published entries before testing their types and completions.
      - name: Build and type-test router package
        run: pnpm -F @wot-ui/router test:types

      # This invokes uni-pages and regenerates src/typed-router.d.ts.
      - name: Build H5
        run: pnpm build:h5

      - name: Ensure generated route types are up to date
        run: git diff --exit-code -- src/typed-router.d.ts

      - name: Type check demo app
        run: pnpm type-check

      - name: Build WeChat Mini Program
        run: pnpm build:mp-weixin

      - name: Build iOS
        run: pnpm build:app-ios

      - name: Upload WeChat Mini Program artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wechat-miniprogram-build
          path: dist/build/mp-weixin/
          retention-days: 7

      - name: Upload H5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h5-build
          path: dist/build/h5/
          retention-days: 7

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: dist/build/app-ios/
          retention-days: 7

      - name: Build Docs (VitePress)
        run: pnpm -C docs run docs:build

      - name: Upload Docs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/.vitepress/dist/
          retention-days: 7

      - name: Build summary
        shell: bash
        run: |
          echo "## Build and Test Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Router unit tests, package build and type/completion tests passed" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Demo app type check and generated route declaration check passed" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ WeChat Mini Program, H5, iOS and docs builds completed" >> "$GITHUB_STEP_SUMMARY"
